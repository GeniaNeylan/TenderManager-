name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller TenderManager.spec

      # Windows 打包结果
      - name: Upload Windows EXE
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TenderManager-Windows
          path: dist/*.exe

      # Mac 打包结果（Mac 需要压缩成 zip 才能上传）
      - name: Package Mac App
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r TenderManager-Mac.zip TenderManager.app

      - name: Upload Mac App
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TenderManager-Mac
          path: dist/TenderManager-Mac.zip

      # 发布 Release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TenderManager.exe
            dist/TenderManager.zip
